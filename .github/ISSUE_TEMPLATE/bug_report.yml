name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Clear steps to reproduce + actual vs expected behavior
      placeholder: |
        1. …
        2. …
        Expected: …
        Actual: …
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Windows, macOS, Linux]
  - type: dropdown
    id: install
    attributes:
      label: How did you install podliner?
      description: Packages can lag behind the latest release, so this helps narrow things down.
      options:
        - Release binary / install script
        - AUR (podliner-bin)
        - winget
        - Built from source
        - Other / not sure
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Podliner version
      placeholder: v0.1.0 (or git commit)
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Use :logs overlay, or attach console logs
      render: shell

