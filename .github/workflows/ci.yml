name: ci

# Build and test gate. Deliberately never triggers on tags so it cannot
# interfere with release.yml, which owns everything tag-driven.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # Runs the published binary in a real pty. Unit tests cannot see either of
  # these: one only shows in the bytes a real exit writes to a terminal (#34),
  # the other in what a running app fetches when nobody touches it (#32).
  exit-teardown:
    name: smoke tests in a real terminal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish
        run: >
          dotnet publish ./Podliner.App/Podliner.App.csproj -c Release -r linux-x64
          -p:SelfContained=true -p:PublishSingleFile=true -o publish

      # Runs before an engine is installed: the runner has no vlc, and an
      # empty PATH hides mpv and ffplay.
      - name: With no audio engine it says what to install
        run: python3 tests/smoke/no_engine.py publish/Podliner.App

      # everything below needs an engine to start; ffplay is the lightest one,
      # and nothing here plays anything anyway
      - name: Install an audio engine
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Quit every way there is and check the teardown
        run: python3 tests/smoke/exit_teardown.py publish/Podliner.App

      - name: Feeds are fetched on their own, and only when they should be
        run: python3 tests/smoke/auto_refresh.py publish/Podliner.App

      - name: Typing after a resize still reaches the command box
        run: python3 tests/smoke/resize_input.py publish/Podliner.App

      # last, so the steps above keep running on ffplay alone; this one needs
      # an engine that reports the position
      - name: Install mpv
        run: sudo apt-get install -y --no-install-recommends mpv

      - name: The position survives kill and a closed terminal
        run: python3 tests/smoke/signal_save.py publish/Podliner.App
